name: fnOS Music Bridge Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build bridge FPKs
        shell: bash
        run: |
          if go list -deps ./cmd/fnos-bridge | grep -E 'go-music-dl/(core|internal/sourceapi)|music-lib'; then
            echo "fnos-bridge must not depend on core/sourceapi implementation/music-lib" >&2
            exit 1
          fi
          version="${GITHUB_REF_NAME#v}"
          if [ -z "${version}" ] || [ "${version}" = "${GITHUB_REF_NAME}" ]; then
            version="$(sed -n 's/.*AppVersion[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' core/version.go | head -n 1)"
          fi
          PKG_VERSION="${version}" ./packaging/fnos-bridge/build-release.sh

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fnos-music-bridge
          path: dist/fnos-bridge/*

      - name: Upload release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/fnos-bridge/*
